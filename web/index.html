<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>坨坨</title>
<style>
  @font-face { font-family: ZK; src: url(zcool.ttf); }
  html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; -webkit-user-select: none; user-select: none; }
  canvas { position: fixed; left: 0; top: 0; display: block; z-index: 10; pointer-events: none; will-change: transform; }
  #desk, #panel { display: none; }
  /* browser dev mode only */
  body.dev { background: linear-gradient(160deg, #2b3a67 0%, #6a4c93 45%, #f08a5d 100%); font-family: -apple-system, "PingFang SC", sans-serif; }
  body.dev #desk { display: block; position: fixed; inset: 0; }
  body.dev #desk::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: 26px; background: rgba(255,255,255,.35); backdrop-filter: blur(20px); }
  body.dev #desk::after { content: ""; position: fixed; left: 50%; bottom: 6px; width: 560px; height: 62px; transform: translateX(-50%); border-radius: 18px; background: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.4); }
  .win { position: absolute; background: #fff; border-radius: 12px; box-shadow: 0 20px 50px rgba(0,0,0,.35); overflow: hidden; }
  .win .bar { height: 30px; background: #f1f1f4; border-bottom: 1px solid #ddd; display: flex; align-items: center; padding: 0 10px; gap: 7px; font-size: 12px; color: #555; cursor: default; }
  .win .bar i { width: 11px; height: 11px; border-radius: 50%; background: #ff5f57; } .win .bar i:nth-child(2) { background: #febc2e; } .win .bar i:nth-child(3) { background: #28c840; }
  .win .bar span { margin-left: 10px; }
  body.dev #panel { display: flex; flex-wrap: wrap; gap: 4px; position: fixed; left: 8px; top: 34px; width: 330px; z-index: 30; }
  #panel button { font: 12px -apple-system, "PingFang SC"; padding: 3px 7px; border-radius: 6px; border: 1px solid #0003; background: #fffd; cursor: pointer; }
  #panel button.x { background: #ffe9a8; }
</style>
</head>
<body>
<div id="desk"></div>
<div id="panel"></div>
<canvas id="cv"></canvas>
<script src="lines.js"></script>
<script src="sound.js"></script>
<script src="pet.js"></script>
<script src="host.js"></script>
</body>
</html>
