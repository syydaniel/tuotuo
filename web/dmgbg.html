<!doctype html>
<html><head><meta charset="utf-8"><title>dmg bg</title>
<style>@font-face{font-family:ZK;src:url(zcool.ttf)} body{margin:0}</style></head>
<body><canvas id="c"></canvas>
<script src="lines.js"></script><script src="sound.js"></script><script src="pet.js"></script>
<script>
// DMG window background, 640x420 points. ?scale=2&save=name
(async function () {
  await document.fonts.load('30px ZK');
  const q = new URLSearchParams(location.search), k = +(q.get('scale') || 1);
  const W = 640, H = 420, c = document.getElementById('c'), ctx = c.getContext('2d');
  c.width = W * k; c.height = H * k; ctx.scale(k, k);
  const U = TuoUtil;
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#fff8e1'); g.addColorStop(1, '#ffe7b3'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // dotted paper
  ctx.fillStyle = 'rgba(160,110,40,.12)'; for (let y = 12; y < H; y += 22) for (let x = 12; x < W; x += 22) { ctx.beginPath(); ctx.arc(x, y, 1.3, 0, 7); ctx.fill(); }
  U.label(ctx, '把坨坨拖进「应用程序」', W / 2, 52, 30, '#7c5cff');
  // hand-drawn arrow between the icon slots (icons sit at x=170 and x=470, y=205)
  ctx.save(); U.inkLine(ctx, 5); ctx.setLineDash([2, 13]); ctx.beginPath(); ctx.moveTo(250, 200); ctx.quadraticCurveTo(320, 160, 388, 198); ctx.stroke(); ctx.setLineDash([]);
  ctx.beginPath(); ctx.moveTo(372, 180); ctx.lineTo(392, 201); ctx.lineTo(366, 210); ctx.stroke(); ctx.restore();
  // little blob mascot peeking at the bottom with a speech bubble
  const pet = new TuoPet({ seed: 2, skin: 1, sfx: Object.assign(new TuoSfx(), { log: [] }) });
  pet.size = 0.95; pet.t = 0.5;
  const rs = pet.baseRS(); Object.assign(rs, { x: 70, y: H + 22, look: { x: 1, y: -0.4 }, blink: 0, swap: 0, face: 1, wob: 0, jx: 0, lw: 3.2 });
  pet.drawBody(ctx, rs);
  ctx.save(); U.wobblyRect(ctx, 118, 318, 408, 72, 16, 3, 0.8); ctx.fillStyle = '#fff'; ctx.fill(); U.inkLine(ctx, 2.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(120, 364); ctx.lineTo(98, 382); ctx.lineTo(121, 380); ctx.fillStyle = '#fff'; ctx.fill(); ctx.stroke(); ctx.restore();
  ctx.fillStyle = U.INK; ctx.font = `15px ${U.FONT}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  ctx.fillText('第一次打开提示"无法验证"？别慌，不是病毒。', 138, 342);
  ctx.fillText('打开旁边的「打不开看这里.txt」，照着点两下就好。', 138, 366);
  document.title = 'done';
  if (q.get('save')) c.toBlob(b => fetch('/png?name=' + q.get('save'), { method: 'POST', body: b }), 'image/png');
})();
</script></body></html>
